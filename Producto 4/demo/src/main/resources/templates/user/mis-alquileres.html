<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis alquileres')}"></head>
<body class="page">

<div th:replace="~{fragments/layout :: navbar}" th:with="activePage='mis-alquileres'"></div>

<main class="main">
    <div class="page-header">
        <div>
            <div class="page-title" th:text="'Hola, ' + ${cliente.nombre} + '!'"></div>
            <div class="page-subtitle">Aquí puedes consultar el historial de tus alquileres</div>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Vehículo</th>
                <th>Recogida</th>
                <th>Devolución</th>
                <th>Fechas</th>
                <th>Total</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="alquiler : ${cliente.alquileres}">
                <td th:text="${alquiler.vehiculo.marca + ' ' + alquiler.vehiculo.modelo}"></td>
                <td th:text="${alquiler.sedeRecogida.nombre}"></td>
                <td th:text="${alquiler.sedeDevolucion.nombre}"></td>
                <td class="td-secondary" th:text="${alquiler.fechaInicio + ' – ' + alquiler.fechaFin}"></td>
                <td><strong th:text="${alquiler.precioTotal + '€'}"></strong></td>
                <td>
                        <span th:class="${alquiler.estado.name() == 'ACTIVO'} ? 'badge badge-success' :
                                        (${alquiler.estado.name() == 'PENDIENTE'} ? 'badge badge-pending' :
                                        (${alquiler.estado.name() == 'CANCELADO'} ? 'badge badge-danger' : 'badge badge-neutral'))"
                              th:text="${alquiler.estado}">
                        </span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(cliente.alquileres)}">
                <td colspan="6" style="text-align:center;color:var(--text-secondary);padding:40px;">
                    No tienes alquileres registrados todavía
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
