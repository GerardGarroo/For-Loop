<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vehículos')}"></head>
<body class="page">

<div th:replace="~{fragments/layout :: navbar}" th:with="activePage='vehiculos'"></div>

<main class="main">
    <div class="page-header">
        <div>
            <div class="page-title">Vehículos disponibles</div>
            <div class="page-subtitle">Selecciona un vehículo para realizar tu reserva</div>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Tipo</th>
                <th>Marca y Modelo</th>
                <th>Matrícula</th>
                <th>Año</th>
                <th>Precio / día</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="vehiculo : ${vehiculos}">
                <td>
                        <span class="material-icons"
                              th:text="${vehiculo.tipo.name() == 'COCHE'} ? 'directions_car' :
                                       (${vehiculo.tipo.name() == 'MOTO'} ? 'two_wheeler' : 'airport_shuttle')">
                        </span>
                </td>
                <td th:text="${vehiculo.marca + ' ' + vehiculo.modelo}"></td>
                <td><strong th:text="${vehiculo.matricula}"></strong></td>
                <td class="td-secondary" th:text="${vehiculo.anio}"></td>
                <td><strong th:text="${vehiculo.precioDia + '€'}"></strong></td>
                <td>
                    <button class="btn btn-disabled" disabled>Reservar</button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(vehiculos)}">
                <td colspan="6" style="text-align:center;color:var(--text-secondary);padding:40px;">
                    No hay vehículos disponibles en este momento
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
