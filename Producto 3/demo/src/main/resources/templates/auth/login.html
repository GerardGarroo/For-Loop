<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar Sesión')}"></head>
<body class="page">
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="main" style="display:flex; justify-content:center; align-items:center; min-height:80vh;">
    <div style="background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px;">
        <h2 style="font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 600; text-align:center; margin-top:0;">Iniciar Sesión</h2>
        <p style="color:#64748b; text-align:center; margin-bottom: 2rem;">Accede con tus credenciales</p>

        <div th:if="${param.error}" style="background-color: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" style="background-color: #dcfce3; color: #15803d; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;">
            Has cerrado sesión correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div style="margin-bottom: 1rem;">
                <label for="username" style="display:block; font-size: 14px; font-weight: 500; color: #334155; margin-bottom: 8px;">Usuario</label>
                <input type="text" id="username" name="username" class="form-input" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;" required autofocus/>
            </div>
            <div style="margin-bottom: 2rem;">
                <label for="password" style="display:block; font-size: 14px; font-weight: 500; color: #334155; margin-bottom: 8px;">Contraseña</label>
                <input type="password" id="password" name="password" class="form-input" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;" required/>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 16px;">Entrar</button>
        </form>
        
        <p style="text-align:center; margin-top: 1.5rem; font-size: 14px; color: #64748b;">
            ¿No tienes cuenta? <a th:href="@{/register}" style="color: #6366f1; font-weight: 500; text-decoration: none;">Regístrate</a>
        </p>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
