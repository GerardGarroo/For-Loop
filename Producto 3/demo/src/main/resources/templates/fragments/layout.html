<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">AlquilaTusVehiculos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
</head>
<body>

<nav th:fragment="navbar">
    <header class="header">
        <div class="logo">¡AtV!<span class="logo-sub">¡Alquila tus vehículos!</span></div>
        <nav class="nav">
            <a th:href="@{/vehiculos}" th:classappend="${activePage == 'vehiculos'} ? 'active'">Vehículos</a>
            <a th:href="@{/clientes}" th:classappend="${activePage == 'clientes'} ? 'active'">Clientes</a>
            <a th:href="@{/sedes}" th:classappend="${activePage == 'sedes'} ? 'active'">Sedes</a>
            <a th:href="@{/alquileres}" th:classappend="${activePage == 'alquileres'} ? 'active'">Alquileres</a>
        </nav>
        <!-- Opciones de Usuario / Login -->
        <div style="display: flex; gap: 8px; align-items: center;">
            <div sec:authorize="isAuthenticated()" style="display: flex; align-items: center; gap: 12px;">
                <div class="avatar" style="position:relative;">
                    <div class="avatar-dot" style="background:#22c55e;"></div>
                </div>
                <span style="font-weight: 500; font-size: 14px; color: #334155;">Hola, <span sec:authentication="name">Usuario</span></span>
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="btn btn-outline btn-sm" style="padding: 6px 12px;">Cerrar Sesión</button>
                </form>
            </div>
            
            <div sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn btn-primary btn-sm" style="padding: 6px 12px; margin-right: 4px;">Login</a>
                <a th:href="@{/register}" class="btn btn-outline btn-sm" style="padding: 6px 12px;">Registrarse</a>
            </div>
        </div>
    </header>
</nav>

<footer th:fragment="footer">
    <div class="footer">
        <span>@For-loop *2026</span>
    </div>
</footer>

</body>
</html>
